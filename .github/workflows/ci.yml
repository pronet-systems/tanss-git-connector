# ---------------------------------------------------------------------------
#  Der blockierende Lauf: jeder Push, jeder Pull Request.
#
#  Er laeuft auf allen drei Zielplattformen. Das ist hier kein Luxus: Der
#  Haken ist eine Datei fuer eine Shell, der Tokenspeicher sieht auf jeder
#  Plattform anders aus, und die Dateirechte gibt es nur unter Unix. Was
#  davon bricht, bricht sonst erst beim Benutzer.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Ein neuer Push auf denselben Zweig macht den vorigen Lauf gegenstandslos.
#
# Die Gruppe nimmt bei einem Pull Request dessen NUMMER statt github.ref: Beim
# Push heisst der Bezug refs/heads/<zweig>, beim Pull Request refs/pull/<n>/merge
# - zwei verschiedene Gruppen, und derselbe Stand liefe zweimal vollstaendig
# durch. Mit der Nummer loeschen Push und Pull Request desselben Zweigs einander
# aus.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  # Englische Werkzeugmeldungen im Protokoll - anders als in der Anwendung, wo
  # Deutsch Pflicht ist: Eine Compilermeldung sucht man im Netz, und dort steht
  # sie englisch.
  DOTNET_CLI_UI_LANGUAGE: 'en'

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      # Ein roter Lauf auf einer Plattform soll die anderen nicht abbrechen:
      # Bei einem plattformabhaengigen Fehler will man wissen, welche noch
      # gruen sind.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v7

      - name: .NET 10 einrichten
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Pakete wiederherstellen
        run: dotnet restore TanssGitConnector.slnx

      - name: Übersetzen
        # -warnaserror doppelt zur Sicherheit: TreatWarningsAsErrors steht
        # bereits in Directory.Build.props. Wer die Eigenschaft dort einmal
        # abschaltet, um lokal weiterzukommen, soll es hier trotzdem merken.
        run: dotnet build TanssGitConnector.slnx -c Release --no-restore -warnaserror

      - name: Tests
        run: >-
          dotnet test TanssGitConnector.slnx -c Release --no-build
          --logger "trx;LogFilePrefix=TanssGitConnector"
          --results-directory artifacts/test-results

      - name: Testergebnisse sichern
        # Auch und gerade bei rotem Lauf: dann will man die .trx lesen.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testergebnisse-${{ matrix.os }}
          path: artifacts/test-results/*.trx
          if-no-files-found: error
          retention-days: 14

  hook:
    name: Der Haken laeuft wirklich (ubuntu)
    # Ein eigener Auftrag, weil er etwas anderes prueft als die Testsuite:
    # nicht, ob der Hakentext stimmt, sondern ob Git ihn ausfuehrt, ob das
    # Werkzeug dabei den richtigen Commit findet und ob der Commit die
    # Warteschlange erreicht, obwohl die Instanz nicht antwortet. Das faellt
    # sonst erst beim Benutzer auf - und dort lautlos.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v7

      - name: .NET 10 einrichten
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Veröffentlichen
        run: >-
          dotnet publish src/TanssGitConnector.Cli/TanssGitConnector.Cli.csproj
          -c Release -o artifacts/cli

      - name: Haken einrichten und einen Commit erzeugen
        # Die Instanzadresse zeigt ins Leere: Gebucht werden SOLL hier nichts.
        # Geprueft wird, dass der Commit trotzdem in der Warteschlange landet -
        # genau das ist die Zusage "ein Netzausfall kostet keine Arbeitszeit".
        run: |
          set -euo pipefail
          export TANSS_GIT_CONNECTOR_HOME="$RUNNER_TEMP/tanss-home"
          mkdir -p "$TANSS_GIT_CONNECTOR_HOME"
          cat > "$TANSS_GIT_CONNECTOR_HOME/config.json" <<'JSON'
          {
            "version": 1,
            "tanss": { "base_url": "https://tanss.invalid.example/backend", "employee_id": 42 },
            "commits": { "remote_support_type_id": 1007, "duration_minutes": 15 },
            "hook": { "timeout_seconds": 5 }
          }
          JSON

          cli="$PWD/artifacts/cli/tanss-git"
          repo="$RUNNER_TEMP/probe"
          mkdir -p "$repo" && cd "$repo"
          git init -q -b "feature/probe#5000" .
          git config user.email ci@example.invalid
          git config user.name  CI

          "$cli" enable
          test -x .git/hooks/post-commit

          echo "hallo" > datei.txt
          git add datei.txt
          git commit -q -m "Erster Commit"

          # Der Commit muss geschrieben sein - der Haken darf ihn nie kosten.
          test "$(git rev-list --count HEAD)" = "1"

      - name: Der Commit liegt in der Warteschlange
        # EIGENER SCHRITT, und zwar ohne "set -e" ueber dem Aufruf: "queue"
        # liefert absichtlich 1, solange etwas wartet (ExitCode.Warning) - das
        # ist ein Befund und kein Fehler. Unter "set -euo pipefail" hat genau
        # das den Lauf frueher abgebrochen.
        run: |
          set -uo pipefail
          # GitHub startet die Shell als "bash -e". "set -uo pipefail" schaltet
          # das NICHT ab - deshalb hier ausdruecklich: Der naechste Aufruf
          # liefert absichtlich 1, und ohne diese Zeile endet der Schritt
          # sofort, noch vor der Ausgabe.
          set +e

          export TANSS_GIT_CONNECTOR_HOME="$RUNNER_TEMP/tanss-home"
          cli="$PWD/artifacts/cli/tanss-git"
          cd "$RUNNER_TEMP/probe"

          "$cli" queue > queue.txt 2>&1
          rc=$?
          set -e
          cat queue.txt
          # 0 = leer, 1 = es wartet etwas. Ab 2 ist es ein Fehler.
          test "$rc" -le 1

          # Geprueft wird die Warteschlangendatei selbst und nicht die Anzeige:
          # Das Wort "wartend" steht auch in der Kopfzeile "wartend 0, …" und
          # traefe deshalb immer.
          queue="$TANSS_GIT_CONNECTOR_HOME/queue.json"
          jq -e '.entries | length == 1' "$queue" > /dev/null
          jq -e '.entries[0].state == "pending"' "$queue" > /dev/null
          jq -e '.entries[0].payload.ticket_id == 5000' "$queue" > /dev/null
          # Gegenprobe: Es wurde NICHTS gebucht - sonst traege der Eintrag die
          # Kennung, die TANSS vergeben haette.
          jq -e '.entries[0].remote_support_id == null' "$queue" > /dev/null
          echo "Der Commit wartet, mit Ticket aus dem Zweignamen, und nichts ist gebucht."

      - name: Haken wieder entfernen
        run: |
          set -uo pipefail
          set +e   # siehe oben: die Shell laeuft mit -e

          export TANSS_GIT_CONNECTOR_HOME="$RUNNER_TEMP/tanss-home"
          cd "$RUNNER_TEMP/probe"

          # Auch "disable" hat einen Befundwert: 1 heisst "dort liegt ein
          # fremder Hook, ich fasse ihn nicht an". Hier muss es 0 sein - alles
          # andere waere ein Fehler im Werkzeug.
          "$GITHUB_WORKSPACE/artifacts/cli/tanss-git" disable
          rc=$?
          set -e
          test "$rc" -eq 0
          test ! -e .git/hooks/post-commit
